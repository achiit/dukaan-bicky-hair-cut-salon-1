<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bicky Hair Cut Salon | Sonai Bazar, Cachar, Assam</title>
<meta name="description" content="Bicky Hair Cut Salon in Sonai Bazar, Cachar, Assam. Haircut, beard styling, facial, hair spa and more at clear prices. Book online.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✂️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#141414;--card:#1e1e1e;--gold:#d4af37;--tx:#f4ede1;--mut:#a39d90;--bd:#363636;--r:12px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0 0 .4em;line-height:1.15}h1{font-size:clamp(2.3rem,7vw,4rem)}h2{font-size:2rem;color:var(--gold)}
a{color:var(--gold)}.w{max-width:1080px;margin:auto;padding:0 18px}section{padding:46px 0}
.sc{height:14px;background:radial-gradient(circle at 10px 0,transparent 8px,var(--gold) 8.5px,var(--gold) 10px,transparent 10.5px) 0 0/20px 14px repeat-x;opacity:.7}
header{position:sticky;top:0;z-index:20;background:#0e0e0ef2;border-bottom:1px solid var(--bd)}header .w{display:flex;align-items:center;gap:12px;min-height:60px}
.logo{font:700 1.3rem 'Cormorant Garamond',serif;color:var(--gold);text-decoration:none;margin-right:auto}nav{display:flex;gap:16px}nav a{color:var(--tx);text-decoration:none;font-size:.95rem}
.btn{display:inline-block;border:1px solid var(--gold);background:transparent;color:var(--gold);padding:10px 18px;border-radius:99px;font:500 .95rem 'DM Sans',sans-serif;cursor:pointer;text-decoration:none}
.btn.g{background:var(--gold);color:#111;font-weight:700}.btn.s{padding:6px 12px;font-size:.85rem}.btn.r{border-color:#c0504d;color:#e07a77}
.btn[hidden],[hidden]{display:none!important}#mb{display:none;background:0;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:1.2rem}
.hero{padding:64px 0 40px;background:radial-gradient(ellipse at 70% 0,#2a2412,transparent 60%)}.hero p{color:var(--mut);max-width:560px;font-size:1.1rem}.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.pr{color:var(--gold);font:700 1.4rem 'Cormorant Garamond',serif}.mut{color:var(--mut);font-size:.9rem}
input,select,textarea{width:100%;background:#111;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;font:inherit;margin:4px 0 10px}input[type=checkbox],input[type=radio]{width:auto;margin:0 8px 0 0}
label{display:block;font-size:.9rem;color:var(--mut)}label.o{display:flex;align-items:center;color:var(--tx);padding:8px 0;border-bottom:1px solid var(--bd)}label.o span{margin-left:auto;color:var(--gold)}
.msg{padding:12px;border-radius:8px;margin:10px 0;background:#2a2412;border:1px solid var(--gold)}.err{background:#331616;border-color:#c0504d}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.gal figure{margin:0}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r)}.gal figcaption{font-size:.85rem;color:var(--mut)}
iframe{width:100%;height:280px;border:0;border-radius:var(--r)}footer{padding:30px 0 90px;text-align:center;border-top:1px solid var(--bd);color:var(--mut)}
#bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0e0e0e;border-top:1px solid var(--gold);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:8px}#bar a{flex:1;text-align:center}
#fab{position:fixed;left:14px;bottom:16px;z-index:25}#ai{position:fixed;right:14px;bottom:16px;z-index:25}
#chat{position:fixed;right:14px;bottom:74px;width:min(340px,calc(100vw - 28px));max-height:70vh;z-index:40;background:var(--card);border:1px solid var(--gold);border-radius:var(--r);display:flex;flex-direction:column}
#cl{overflow:auto;padding:10px;flex:1;min-height:120px}#cl p{margin:6px 0;padding:8px 10px;border-radius:10px;background:#111;font-size:.92rem;white-space:pre-line}#cl p.u{background:#2a2412;margin-left:30px}
#own{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0}.tabs button{white-space:nowrap}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.stat b{display:block;font-size:1.5rem;color:var(--gold)}.tw{overflow-x:auto}
.demo{background:#2a2412;color:var(--gold);text-align:center;font-size:.8rem;padding:4px}
@media(max-width:1080px){h2{font-size:1.8rem}}@media(max-width:820px){nav{display:none}nav.open{display:flex;flex-direction:column;position:absolute;top:60px;left:0;right:0;background:#0e0e0e;padding:14px 18px}#mb{display:block}}
@media(max-width:768px){#bar{display:flex}#fab{display:none}#ai{bottom:76px}#chat{bottom:132px}}@media(max-width:520px){section{padding:34px 0}.hdr-cta{display:none}}
</style>
</head>
<body>
<div class="demo">DEMO / LOCAL MODE — data is saved only in this browser. Connect Firebase or Supabase for cloud sync and secure login.</div>
<div id="app"></div>
<div id="bar"><a class="btn" id="bc">Call</a><a class="btn g" id="bw">WhatsApp</a></div>
<a id="fab" class="btn g">WhatsApp</a>
<button id="ai" class="btn g">Ask assistant</button>
<div id="chat" hidden><div style="padding:10px;border-bottom:1px solid var(--bd)"><b id="an">Assistant</b><div class="mut">Basic FAQ assistant (AI not connected) · हिंदी / English</div></div><div id="cl"></div><div style="display:flex;gap:6px;padding:8px"><input id="cq" placeholder="Type your question…" style="margin:0"><button class="btn g" id="cs">Send</button></div></div>
<div id="own" hidden></div>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const def=()=>({cfg:{name:'Bicky Hair Cut Salon',tag:'Look Smart. Feel Confident.',owner:'',about:'',years:'',addr:'Sonai Bazar, Cachar, Assam',hours:'',phone:'',wa:'',maps:'',ig:'',fb:'',yt:'',cash:1,upi:1,upiId:'',bookOn:1,aiOn:1,note:'',ainame:'Salon Assistant'},
svc:[['Haircut',80,0,'A clean, precise haircut.'],['Beard Trim / Clean',50,0,'Neat trim and clean-up for your beard.'],['Beard Style',60,0,'Shaping and styling your beard.'],['Face Wash',50,1,'Refreshing face wash.'],['Facial',450,1,'Skin-care facial treatment.'],['Hair Spa',450,1,'Relaxing hair spa treatment.'],['Hair Straightening',500,1,'Smooth, straight hair finish.']].map((a,i)=>({id:'s'+i,n:a[0],p:a[1],st:a[2],d:a[3],on:1})),gal:[],bk:[],cu:{},log:[],pin:null,salt:''});
let S;try{S=JSON.parse(localStorage.getItem('bicky'))}catch(e){}S=S||def();
const save=()=>{try{localStorage.setItem('bicky',JSON.stringify(S))}catch(e){toast('Could not save: storage is full or blocked.',1)}};
const day=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dig=t=>String(t||'').replace(/\D/g,'').slice(-10),ok10=t=>dig(t).length==10;
const wa=m=>ok10(S.cfg.wa)?'https://wa.me/91'+dig(S.cfg.wa)+'?text='+encodeURIComponent(m):'';
const pf=s=>(s.st?'Starting at ':'')+'₹'+s.p;
function toast(t,e){const d=document.createElement('div');d.className='msg'+(e?' err':'');d.style.cssText='position:fixed;left:14px;right:14px;bottom:90px;z-index:200;text-align:center';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3000)}
const waBtn=(l,m,c='')=>wa(m)?`<a class="btn ${c}" target="_blank" rel="noopener" href="${wa(m)}">${l}</a>`:'';
function pub(){const c=S.cfg,a=S.svc.filter(s=>s.on),g=S.gal.filter(x=>x.on),ph=ok10(c.phone)?'tel:+91'+dig(c.phone):'';
document.title=c.name+' | '+(c.addr||'Salon');
const soc=[['Instagram',c.ig],['Facebook',c.fb],['YouTube',c.yt]].filter(x=>/^https?:\/\//.test(x[1])).map(x=>`<a href="${esc(x[1])}" target="_blank" rel="noopener">${x[0]}</a>`).join(' · ');
const gm=c.maps&&/^https?:\/\//.test(c.maps)?c.maps:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.addr);
$('#app').innerHTML=`<header><div class="w"><a class="logo" href="#home">✂ ${esc(c.name)}</a><nav id="nv"><a href="#home">Home</a><a href="#services">Services</a>${g.length?'<a href="#gallery">Gallery</a>':''}<a href="#about">About</a><a href="#contact">Contact</a></nav>${ph?`<a class="btn s hdr-cta" href="${ph}">Call</a>`:''}${waBtn('WhatsApp','Hello! I have an enquiry for '+c.name+'.','s g hdr-cta')}<button id="mb" aria-label="Menu">☰</button></div></header>
<main><section class="hero" id="home"><div class="w"><h1>${esc(c.name)}</h1><p style="color:var(--gold);font-size:1.3rem;margin:0">${esc(c.tag)}</p><p>Sharp haircuts, tidy beards and relaxing grooming care, served with honest prices in the heart of Sonai Bazar.</p>
<div class="row">${ph?`<a class="btn" href="${ph}">Call Now</a>`:''}${waBtn('WhatsApp','Hello! I would like to enquire about an appointment at '+c.name+'.','g')}${c.bookOn?'<a class="btn g" href="#book">Book Appointment</a>':''}</div>
<div class="grid" style="margin-top:28px"><div class="card"><b>${a.length}</b><div class="mut">Services available</div></div>${c.hours?`<div class="card"><b>Opening hours</b><div class="mut">${esc(c.hours)}</div></div>`:''}${c.years?`<div class="card"><b>${esc(c.years)}</b><div class="mut">Years in business</div></div>`:''}</div></div></section><div class="sc"></div>
<section id="services"><div class="w"><h2>Services &amp; Prices</h2><p class="mut">Transparent price list. “Starting at” means the final price depends on the service required.</p><div class="grid">${a.map(s=>`<div class="card"><h3>${esc(s.n)}</h3><p class="mut">${esc(s.d)}</p><div class="pr">${pf(s)}</div><div class="row">${c.bookOn?`<button class="btn s g" onclick="pick('${s.id}')">Book this service</button>`:''}${waBtn('WhatsApp enquiry','Hello! Please tell me about '+s.n+' ('+pf(s)+') at '+c.name+'.','s')}</div></div>`).join('')||'<p class="mut">No services available right now.</p>'}</div></div></section><div class="sc"></div>
${c.bookOn?`<section id="book"><div class="w"><h2>Book Appointment</h2>${c.note?`<p class="mut">${esc(c.note)}</p>`:''}<div class="card" id="bf"><label>Your name<input id="bn" autocomplete="name" maxlength="60"></label><label>Mobile number<input id="bm" inputmode="numeric" autocomplete="tel" maxlength="14" placeholder="10-digit mobile"></label><div>Select services</div>${a.map(s=>`<label class="o"><input type="checkbox" class="sv" value="${s.id}">${esc(s.n)}<span>${pf(s)}</span></label>`).join('')}<div style="margin:12px 0"><b>Total: <span class="pr" id="tt">₹0</span></b><div class="mut" id="tn"></div></div><label>Preferred date (optional)<input type="date" id="bd" min="${day()}"></label><label>Note (optional)<textarea id="bt" rows="2" maxlength="200"></textarea></label><div>Payment method</div>${[c.cash?['Cash','Cash at salon']:0,c.upi?['Online/UPI','Online / UPI']:0].filter(Boolean).map((p,i)=>`<label class="o"><input type="radio" name="pm" value="${p[0]}" ${i?'':'checked'}>${p[1]}</label>`).join('')||'<p class="mut">Pay at the salon.</p>'}<button class="btn g" id="bs" style="margin-top:12px">Confirm Booking</button><div id="br"></div></div></div></section><div class="sc"></div>`:''}
${g.length?`<section id="gallery"><div class="w"><h2>Gallery</h2><div class="gal">${g.map(x=>`<figure><img loading="lazy" width="400" height="400" src="${x.src}" alt="${esc(x.cap||'Salon photo')}"><figcaption>${esc(x.cap)}</figcaption></figure>`).join('')}</div></div></section><div class="sc"></div>`:''}
<section id="about"><div class="w"><h2>About Us</h2><p>${esc(c.about)||`${esc(c.name)} is a neighbourhood hair salon in Sonai Bazar, Cachar, offering haircuts, beard care and grooming services.`}</p>${c.owner?`<p class="mut">Owner: ${esc(c.owner)}</p>`:''}</div></section>
<section id="contact"><div class="w"><h2>Contact &amp; Location</h2><div class="grid"><div class="card"><b>${esc(c.name)}</b><p>${esc(c.addr)}</p>${c.hours?`<p>Hours: ${esc(c.hours)}</p>`:''}${ph?`<p>Phone: <a href="${ph}">${esc(c.phone)}</a></p>`:''}${soc?`<p>${soc}</p>`:''}<div class="row"><a class="btn g" target="_blank" rel="noopener" href="${esc(gm)}">Get Directions</a></div></div><iframe loading="lazy" title="Map" src="https://maps.google.com/maps?q=${encodeURIComponent(c.addr)}&output=embed"></iframe></div>${wa('x')?`<p class="mut">Happy with our service? Share your feedback on WhatsApp.</p>`:''}</div></section></main>
<footer><div class="sc"></div><div class="w" style="padding-top:22px"><b style="color:var(--gold)">${esc(c.name)}</b><p>${esc(c.tag)}</p>${waBtn('Chat on WhatsApp','Hello! I have an enquiry for '+c.name+'.','g')}<p class="mut">© ${new Date().getFullYear()} ${esc(c.name)}</p><p class="mut" style="font-size:.75rem">BUILT WITH ❤️ BY 21.CODERS</p><button class="btn s" onclick="own()">Owner Login</button></div></footer>`;
$('#mb').onclick=()=>$('#nv').classList.toggle('open');document.querySelectorAll('#nv a').forEach(a=>a.onclick=()=>$('#nv').classList.remove('open'));
const w=wa('Hello! I have an enquiry for '+c.name+'.');[['#bw',w],['#fab',w]].forEach(([s,h])=>{const e=$(s);e.hidden=!h;if(h){e.href=h;e.target='_blank'}});$('#bc').hidden=!ph;if(ph)$('#bc').href=ph;
$('#ai').hidden=!c.aiOn;$('#an').textContent=c.ainame||'Salon Assistant';if(!c.aiOn)$('#chat').hidden=true;
document.querySelectorAll('.sv').forEach(e=>e.onchange=tot);if($('#bs'))$('#bs').onclick=book}
function pick(id){const e=document.querySelector('.sv[value="'+id+'"]');if(e){e.checked=true;tot();$('#book').scrollIntoView()}}
function sel(){return [...document.querySelectorAll('.sv:checked')].map(e=>S.svc.find(s=>s.id==e.value)).filter(Boolean)}
function tot(){const x=sel();$('#tt').textContent='₹'+x.reduce((a,s)=>a+s.p,0);$('#tn').textContent=x.some(s=>s.st)?'Includes starting prices — final amount may vary.':''}
let busy=0;
function book(){if(busy)return;const r=$('#br'),n=$('#bn').value.trim(),m=dig($('#bm').value),x=sel();r.innerHTML='';
const er=t=>r.innerHTML=`<div class="msg err">${t}</div>`;if(n.length<2)return er('Please enter your name.');if(!ok10(m))return er('Please enter a valid 10-digit mobile number.');if(!x.length)return er('Please select at least one service.');
busy=1;$('#bs').disabled=true;try{const d=$('#bd').value||day(),pm=(document.querySelector('[name=pm]:checked')||{}).value||'Cash',tk=Math.max(0,...S.bk.filter(b=>b.date==d).map(b=>b.token))+1,
b={id:'BK'+Date.now().toString(36).toUpperCase(),date:d,token:tk,name:n,mob:m,items:x.map(s=>({n:s.n,p:s.p,st:s.st})),total:x.reduce((a,s)=>a+s.p,0),pay:pm,ps:pm=='Cash'?'Unpaid':'Pending verification',st:'Waiting',note:$('#bt').value.trim(),at:new Date().toISOString()};
S.bk.push(b);const u=S.cu[m];S.cu[m]=u?{...u,last:d}:{name:n,mob:m,first:d,last:d};save();
const msg=`Booking ${b.id}\nName: ${n}\nToken: ${tk} (${d})\nServices: ${b.items.map(i=>i.n+' ₹'+i.p).join(', ')}\nTotal: ₹${b.total}\nPayment: ${pm}`;
r.innerHTML=`<div class="msg"><b>Booking saved!</b><br>Booking ID: ${b.id}<br>Token number: <b>${tk}</b> for ${d}<br>${b.items.map(i=>esc(i.n)+' — ₹'+i.p).join('<br>')}<br>Total: ₹${b.total}${pm=='Online/UPI'?`<br><br>${S.cfg.upiId?'UPI ID: <b>'+esc(S.cfg.upiId)+'</b><br>':''}Your payment is <b>pending</b> until the salon verifies it.`:''}<div class="row">${waBtn('Share on WhatsApp',msg,'g')}</div></div>`;
$('#bf').querySelectorAll('input[type=text],textarea').forEach(e=>e.value='');$('#bn').value='';$('#bm').value='';document.querySelectorAll('.sv').forEach(e=>e.checked=false);tot()}catch(e){er('Booking failed. Please try again or contact the salon.')}
setTimeout(()=>{busy=0;const b=$('#bs');if(b)b.disabled=false},1500)}
/* Assistant */
function ans(q){const c=S.cfg,a=S.svc.filter(s=>s.on),l=q.toLowerCase(),hi=/[\u0900-\u097F]/.test(q),has=(...k)=>k.some(x=>l.includes(x)),L=a.map(s=>s.n+' — '+pf(s)).join('\n');
const m=a.filter(s=>l.includes(s.n.toLowerCase().split(' /')[0]));
if(m.length>1)return `${m.map(s=>s.n).join(' + ')} = ₹${m.reduce((t,s)=>t+s.p,0)}${m.some(s=>s.st)?' (starting prices; final may vary)':''}`;
if(m.length==1)return `${m[0].n}: ${pf(m[0])}`;
if(has('price','rate','cost','kitna','कीमत','दाम','रेट','भाव','कितना','starting'))return (hi?'हमारी कीमतें:\n':'Our prices:\n')+L;
if(has('service','सेवा','सर्विस'))return (hi?'उपलब्ध सेवाएँ:\n':'Available services:\n')+L;
if(has('book','बुक','appointment','token'))return c.bookOn?(hi?'ऊपर “Book Appointment” फ़ॉर्म भरें। बुकिंग सेव होने के बाद ही टोकन मिलेगा।':'Use the “Book Appointment” form on this page. Your token is issued only after the booking is saved.'):'Online booking is currently unavailable.';
if(has('where','address','location','kahan','कहाँ','कहां','पता','map'))return c.addr+(hi?' (दिशा के लिए Contact सेक्शन देखें)':' — see Contact for directions.');
if(has('hour','open','time','समय','खुल','कब','timing'))return c.hours?(hi?'समय: ':'Opening hours: ')+c.hours:'Opening hours have not been added yet. Please contact the salon.';
if(has('call','phone','whatsapp','contact','number','संपर्क','नंबर','फोन'))return [ok10(c.phone)?'Phone: '+c.phone:'',ok10(c.wa)?'WhatsApp: '+c.wa:''].filter(Boolean).join('\n')||'Contact numbers have not been added yet.';
return hi?'मैं सेवाओं, कीमत, बुकिंग, पते और समय के बारे में बता सकता हूँ।':'I can help with services, prices, booking, address and opening hours.'}
function say(t,u){const p=document.createElement('p');p.className=u?'u':'';p.textContent=t;$('#cl').append(p);$('#cl').scrollTop=1e5}
$('#ai').onclick=()=>{const h=$('#chat');h.hidden=!h.hidden;if(!h.hidden&&!$('#cl').children.length)say(`Hello! Ask me about services, prices, booking or location. नमस्ते!`)};
const send=()=>{const v=$('#cq').value.trim();if(!v)return;say(v,1);$('#cq').value='';say(ans(v))};$('#cs').onclick=send;$('#cq').onkeydown=e=>{if(e.key=='Enter')send()};
/* Owner */
let O=0,tab='ov',F={d:day(),q:''},R={a:day(),b:day()};
const hsh=async p=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(S.salt+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function cls(){$('#own').hidden=true;document.body.style.overflow='';O=0;pub()}
function own(){const o=$('#own');o.hidden=false;document.body.style.overflow='hidden';if(!S.pin||!O){const n=!S.pin;o.innerHTML=`<div class="w" style="max-width:380px;padding-top:60px"><h2>${n?'Create Owner PIN':'Owner Login'}</h2><div class="card"><label>${n?'New PIN (4–8 digits)':'Enter PIN'}<input id="p1" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label>${n?'<label>Confirm PIN<input id="p2" type="password" inputmode="numeric" maxlength="8"></label>':''}<div id="pe"></div><button class="btn g" onclick="auth(${n})">${n?'Create PIN':'Login'}</button> <button class="btn" onclick="cls()">Close</button><p class="mut">Demo mode: this PIN protects the dashboard only in this browser. Real secure login needs a backend.</p></div></div>`;return}
const T=[['ov','Overview'],['bk','Bookings'],['cu','Customers'],['sv','Services'],['st','Settings'],['gl','Gallery'],['bu','Backup']];
o.innerHTML=`<div class="w"><div class="row" style="align-items:center"><h2 style="margin:0">Owner Dashboard</h2><button class="btn s" onclick="O=0;cls()" style="margin-left:auto">Logout</button><button class="btn s" onclick="cls()">Close</button></div><div class="tabs">${T.map(t=>`<button class="btn s ${t[0]==tab?'g':''}" onclick="tab='${t[0]}';own()">${t[1]}</button>`).join('')}</div><div id="tc">${TB[tab]()}</div></div>`}
async function auth(n){const p=$('#p1').value,e=m=>$('#pe').innerHTML=`<div class="msg err">${m}</div>`;if(!/^\d{4,8}$/.test(p))return e('PIN must be 4–8 digits.');
if(n){if(p!=$('#p2').value)return e('PINs do not match.');S.salt=crypto.getRandomValues(new Uint32Array(4)).join('-');S.pin=await hsh(p);save();O=1;own()}else if(await hsh(p)==S.pin){O=1;own()}else e('Wrong PIN.')}
const paid=b=>b.ps=='Paid'&&b.st!='Cancelled',sum=a=>a.reduce((t,b)=>t+b.total,0),opt=(v,a)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
const TB={
ov(){const t=day(),td=S.bk.filter(b=>b.date==t),rg=S.bk.filter(b=>b.date>=R.a&&b.date<=R.b),pd=a=>a.filter(paid),by={};pd(rg).forEach(b=>b.items.forEach(i=>by[i.n]=(by[i.n]||0)+i.p));
const c=(l,v)=>`<div class="card"><b>${v}</b>${l}</div>`;
return `<div class="stat">${c('Today’s bookings',td.length)}${c('Customers',Object.keys(S.cu).length)}${c('Waiting',td.filter(b=>b.st=='Waiting').length)}${c('Serving',td.filter(b=>b.st=='Serving').length)}${c('Completed',td.filter(b=>b.st=='Completed').length)}${c('Paid income today','₹'+sum(pd(td)))}${c('Cash today','₹'+sum(pd(td).filter(b=>b.pay=='Cash')))}${c('Online today','₹'+sum(pd(td).filter(b=>b.pay!='Cash')))}${c('Pending payments',S.bk.filter(b=>b.ps=='Pending verification').length)}</div>
<h3 style="margin-top:20px">Today’s token queue</h3>${td.filter(b=>b.st!='Cancelled').sort((a,b)=>a.token-b.token).map(b=>`<div class="card" style="margin:6px 0">#${b.token} · ${esc(b.name)} · ${b.st}</div>`).join('')||'<p class="mut">No bookings today.</p>'}
<h3 style="margin-top:20px">Income report</h3><div class="row"><input type="date" id="ra" value="${R.a}" style="width:auto"><input type="date" id="rb" value="${R.b}" style="width:auto"><button class="btn s" onclick="R={a:$('#ra').value,b:$('#rb').value};own()">Show</button><button class="btn s" onclick="csv()">Export CSV</button></div>
<div class="stat">${c('Bookings',rg.length)}${c('Completed',rg.filter(b=>b.st=='Completed').length)}${c('Cancelled',rg.filter(b=>b.st=='Cancelled').length)}${c('Paid income','₹'+sum(pd(rg)))}${c('Unpaid amount','₹'+sum(rg.filter(b=>b.st!='Cancelled'&&b.ps!='Paid'&&b.ps!='Refunded')))}${c('Cash','₹'+sum(pd(rg).filter(b=>b.pay=='Cash')))}${c('Online','₹'+sum(pd(rg).filter(b=>b.pay!='Cash')))}</div><p class="mut">Only bookings marked Paid are counted as income.</p><h3>Service-wise income</h3>${Object.entries(by).map(e=>`<div>${esc(e[0])}: ₹${e[1]}</div>`).join('')||'<p class="mut">No paid bookings in this range.</p>'}`},
bk(){const q=F.q.toLowerCase(),r=S.bk.filter(b=>(!F.d||b.date==F.d)&&(!q||(b.name+b.mob+b.id+'#'+b.token).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||a.token-b.token);
return `<div class="row"><input type="date" id="fd" value="${F.d}" style="width:auto"><input id="fq" placeholder="Search name, mobile, ID, token" value="${esc(F.q)}" style="width:auto;flex:1"><button class="btn s" onclick="F={d:$('#fd').value,q:$('#fq').value};own()">Filter</button><button class="btn s" onclick="F={d:'',q:''};own()">All dates</button></div>${r.map(b=>`<div class="card" style="margin:8px 0"><b>#${b.token}</b> · ${b.date} · ${esc(b.name)} · ${b.mob}<br>${b.items.map(i=>esc(i.n)+' ₹'+i.p).join(', ')}<br><b>₹${b.total}</b> · ${b.pay} · <span class="mut">${b.id}${b.pd?' · paid '+b.pd:''}</span>${b.note?'<br>Note: '+esc(b.note):''}<div class="row"><select onchange="ub('${b.id}','st',this.value)" style="width:auto">${opt(b.st,['Waiting','Serving','Completed','Cancelled'])}</select><select onchange="ub('${b.id}','ps',this.value)" style="width:auto">${opt(b.ps,['Paid','Unpaid','Pending verification','Refunded'])}</select></div></div>`).join('')||'<p class="mut">No bookings found.</p>'}`},
cu(){const q=F.q.toLowerCase();return `<div class="row"><input id="fq" placeholder="Search name or mobile" value="${esc(F.q)}" style="width:auto;flex:1"><button class="btn s" onclick="F.q=$('#fq').value;own()">Search</button></div>${Object.values(S.cu).filter(u=>!q||(u.name+u.mob).toLowerCase().includes(q)).map(u=>{const b=S.bk.filter(x=>x.mob==u.mob),v=b.filter(x=>x.st!='Cancelled');return `<div class="card" style="margin:8px 0"><b>${esc(u.name)}</b> · ${u.mob}<br>First visit: ${u.first} · Last: ${u.last} · Visits: ${v.length} · Verified spend: ₹${sum(b.filter(paid))}<br><span class="mut">${b.map(x=>x.date+': '+x.items.map(i=>i.n).join('+')+' ('+x.st+')').join(' | ')}</span><div class="row"><button class="btn s" onclick="ec('${u.mob}')">Edit name</button><button class="btn s r" onclick="dc('${u.mob}')">Delete profile</button></div></div>`}).join('')||'<p class="mut">No customers yet.</p>'}`},
sv(){return `<button class="btn g s" onclick="as()">+ Add service</button>${S.svc.map((s,i)=>`<div class="card" style="margin:8px 0"><input value="${esc(s.n)}" onchange="us(${i},'n',this.value)"><input type="number" min="0" value="${s.p}" onchange="us(${i},'p',+this.value||0)"><input value="${esc(s.d)}" onchange="us(${i},'d',this.value)"><label class="o"><input type="checkbox" ${s.st?'checked':''} onchange="us(${i},'st',+this.checked)">Starting price</label><label class="o"><input type="checkbox" ${s.on?'checked':''} onchange="us(${i},'on',+this.checked)">Visible to customers</label><div class="row"><button class="btn s" onclick="mv(${i},-1)">↑</button><button class="btn s" onclick="mv(${i},1)">↓</button><button class="btn s r" onclick="ds(${i})">Delete</button></div></div>`).join('')}`},
st(){const c=S.cfg,f=(k,l,t='text')=>t=='chk'?`<label class="o"><input type="checkbox" data-k="${k}" ${c[k]?'checked':''}>${l}</label>`:`<label>${l}<input data-k="${k}" value="${esc(c[k])}"></label>`;
return `<div class="card">${f('name','Business name')}${f('tag','Tagline')}${f('owner','Owner name')}<label>About<textarea data-k="about" rows="3">${esc(c.about)}</textarea></label>${f('years','Years in business')}${f('addr','Address')}${f('hours','Opening hours')}${f('phone','Phone number (10 digits)')}${f('wa','WhatsApp number (10 digits)')}${f('maps','Google Maps / directions link')}${f('ig','Instagram link')}${f('fb','Facebook link')}${f('yt','YouTube link')}${f('cash','Enable Cash payment','chk')}${f('upi','Enable Online/UPI payment','chk')}${f('upiId','UPI ID')}${f('bookOn','Enable bookings','chk')}${f('note','Booking instructions')}${f('aiOn','Show assistant','chk')}${f('ainame','Assistant name')}<div class="row"><button class="btn g" onclick="ss()">Save</button><button class="btn" onclick="own()">Cancel</button></div></div><div class="card" style="margin-top:10px"><b>Change PIN</b><input id="np" type="password" inputmode="numeric" maxlength="8" placeholder="New 4–8 digit PIN"><button class="btn s" onclick="cp()">Change PIN</button></div>`},
gl(){return `<label class="btn g s">+ Upload photo<input type="file" accept="image/*" hidden onchange="up(this)"></label>${S.gal.map((x,i)=>`<div class="card row" style="margin:8px 0;align-items:center"><img src="${x.src}" width="60" height="60" style="object-fit:cover;border-radius:8px" alt=""><input value="${esc(x.cap)}" placeholder="Caption" onchange="S.gal[${i}].cap=this.value;save()" style="flex:1;width:auto"><label class="o" style="border:0"><input type="checkbox" ${x.on?'checked':''} onchange="S.gal[${i}].on=+this.checked;save()">Show</label><button class="btn s" onclick="mg(${i},-1)">↑</button><button class="btn s" onclick="mg(${i},1)">↓</button><button class="btn s r" onclick="dg(${i})">Delete</button></div>`).join('')||'<p class="mut">No photos yet. Uploaded photos are resized and saved in this browser.</p>'}`},
bu(){return `<p class="mut">Backups include settings, services, gallery, bookings and customers (not the PIN).</p><div class="row"><button class="btn g" onclick="bd()">Download JSON backup</button><label class="btn">Restore backup<input type="file" accept=".json" hidden onchange="rs(this)"></label></div>`}};
function ub(id,k,v){const b=S.bk.find(x=>x.id==id);if(k=='st'&&v=='Cancelled'&&!confirm('Cancel this booking? It will stay recorded.')){own();return}
const o=b[k];b[k]=v;if(k=='ps'){b.pd=v=='Paid'?day():'';S.log.push({id,from:o,to:v,at:new Date().toISOString()})}save();own()}
function csv(){const r=S.bk.filter(b=>b.date>=R.a&&b.date<=R.b),q=t=>'"'+String(t).replace(/"/g,'""')+'"';dl('bookings.csv','ID,Date,Token,Name,Mobile,Services,Total,Payment,PaymentStatus,Status\n'+r.map(b=>[b.id,b.date,b.token,b.name,b.mob,b.items.map(i=>i.n).join('+'),b.total,b.pay,b.ps,b.st].map(q).join(',')).join('\n'),'text/csv')}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function ec(m){const n=prompt('Customer name',S.cu[m].name);if(n&&n.trim()){S.cu[m].name=n.trim();save();own()}}
function dc(m){if(confirm('Delete this customer profile? Their bookings and payment records will be kept.')){delete S.cu[m];save();own()}}
function as(){S.svc.push({id:'s'+Date.now(),n:'New service',p:0,st:0,d:'',on:0});save();own()}
function us(i,k,v){S.svc[i][k]=v;save()}
function mv(i,d){const j=i+d;if(j<0||j>=S.svc.length)return;[S.svc[i],S.svc[j]]=[S.svc[j],S.svc[i]];save();own()}
function ds(i){if(confirm('Delete this service?')){S.svc.splice(i,1);save();own()}}
function ss(){document.querySelectorAll('[data-k]').forEach(e=>S.cfg[e.dataset.k]=e.type=='checkbox'?+e.checked:e.value.trim());save();toast('Settings saved.');own()}
async function cp(){const p=$('#np').value;if(!/^\d{4,8}$/.test(p))return toast('PIN must be 4–8 digits.',1);S.pin=await hsh(p);save();toast('PIN changed.')}
function up(i){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.gal.push({src:c.toDataURL('image/jpeg',.7),cap:'',on:1});save();own()};im.onerror=()=>toast('Not a valid image.',1);im.src=URL.createObjectURL(f)}
function mg(i,d){const j=i+d;if(j<0||j>=S.gal.length)return;[S.gal[i],S.gal[j]]=[S.gal[j],S.gal[i]];save();own()}
function dg(i){if(confirm('Delete this photo?')){S.gal.splice(i,1);save();own()}}
function bd(){const{pin,salt,...d}=S;dl('bicky-backup-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json',JSON.stringify({app:'bicky',at:new Date().toISOString(),data:d}),'application/json')}
function rs(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t),d=j.data;if(j.app!='bicky'||!d||!Array.isArray(d.svc)||!Array.isArray(d.bk)||typeof d.cfg!='object'||typeof d.cu!='object')throw 0;if(!confirm('Restore backup from '+j.at+'? This replaces current data.'))return;S={...d,pin:S.pin,salt:S.salt,log:d.log||[],gal:d.gal||[]};save();own();toast('Backup restored.')}catch(e){toast('Invalid backup file.',1)}})}
pub();if(location.hash=='#owner')own();
</script>
